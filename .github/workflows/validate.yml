name: Validate documentation and offline baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python scripts/build_report.py --check
      - run: python -m unittest discover -s evals -p 'test_*.py' -v
      - run: python -m evals.run --cases evals/fixtures/cases.jsonl --out results/local-ci
      - run: python -m evals.score --outputs results/local-ci/outputs.jsonl --labels evals/fixtures/labels.jsonl --require-exact
